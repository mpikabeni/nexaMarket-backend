# =========================================================
# NEXMARKET - render.yaml (corrigé)
#
# Changements :
#  - suppression du service "worker" : main.py lance DÉJÀ le bot en
#    polling ; deux processus sur le même token => erreur Telegram
#    409 Conflict. (De plus `python bot.py` visait un fichier qui
#    n'existe pas à la racine : le worker ne pouvait pas démarrer.)
#  - suppression des variables MONEYFUSION_* (fournisseur jamais lu
#    par le code) ;
#  - ajout des variables JESSIKAPAY_*, ADMIN_TELEGRAM_ID,
#    qui manquaient ; pas de webhook JessiKaPay (dépôts vérifiés par polling) ;
#  - nom du service aligné sur l'URL appelée par le frontend.
# =========================================================

services:
  - type: web
    # Render ajoute un suffixe si le nom est déjà pris : l'URL réelle de ce
    # service est https://nexamarket-backend-ffea.onrender.com (celle du frontend).
    name: nexamarket-backend
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: NexMarket API
      - key: APP_VERSION
        value: 1.0.11
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://nexamarketf.netlify.app
      - key: PUBLIC_URL
        value: https://nexamarket-backend-ffea.onrender.com
      - key: CORS_ORIGINS
        value: https://nexamarketf.netlify.app

      - key: DATABASE_URL
        fromDatabase:
          name: nexmarket-db
          property: connectionString

      # --- Telegram ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false

      # --- Sécurité / admin ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ADMIN_CODE
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false

      # --- Commission / escrow ---
      - key: NEXMARKET_FEE_RATE
        value: 0.05
      - key: ESCROW_PROTECTION_MINUTES
        value: 60
      - key: PENDING_PAYMENT_TTL_MINUTES
        value: 120

      # --- JessiKaPay ---
      - key: JESSIKAPAY_API_URL
        sync: false
      - key: JESSIKAPAY_API_KEY
        sync: false
      - key: JESSIKAPAY_API_SECRET
        sync: false
      - key: NEXA_JP_NUMBER
        sync: false

databases:
  - name: nexmarket-db
    databaseName: nexmarket
    user: nexmarket
    # ATTENTION : l'offre "free" de Render supprime la base après
    # une durée limitée. Passez à une offre payante avant la prod.
    plan: free
